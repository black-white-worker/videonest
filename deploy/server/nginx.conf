# videonest 前端 nginx（作为 /etc/nginx/nginx.conf 整文件挂载）
# 与原仓库配置的区别：
#   1) backend -> vn-backend（共用 lp-shared 网络，避免重名）
#   2) 去掉 /minio/ 反代：预签名 URL 的签名里带 host:port，媒体统一走 MinIO 公网 9010
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    map $uri $access_loggable {
        ~^/api/videos/[0-9]+/views$ 0;
        default 1;
    }
    access_log /var/log/nginx/access.log main if=$access_loggable;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_header_timeout 15s;
    client_body_timeout 600s;
    send_timeout 600s;
    types_hash_max_size 4096;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream vn_backend {
        server vn-backend:8080;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 510m;
        keepalive_timeout 65s;
        keepalive_requests 1000;
        etag on;

        location ^~ /api/ {
            proxy_pass http://vn_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
            try_files $uri =404;
            directio 4m;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            access_log off;
        }

        location ~* \.(?:css|js|mjs|map|json|txt|xml)$ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
            access_log off;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
