# videonest 前端 nginx（作为 /etc/nginx/nginx.conf 整文件挂载）
# 与原仓库配置的区别：
#   1) backend -> vn-backend（共用 lp-shared 网络，避免重名）
#   2) 去掉 /minio/ 反代：预签名 URL 的签名里带 host:port，媒体统一走 MinIO 公网 9010
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    map $uri $access_loggable {
        ~^/api/videos/[0-9]+/views$ 0;
        default 1;
    }
    access_log /var/log/nginx/access.log main if=$access_loggable;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_header_timeout 15s;
    client_body_timeout 600s;
    send_timeout 600s;
    types_hash_max_size 4096;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream vn_backend {
        server vn-backend:8080;
        keepalive 64;
    }

    # 过载快速失败：按请求计数（keep-alive 连接上的请求也计），超限立刻 503，
    # 而不是让请求在后端执行器队列里排到客户端 20s 超时（压测报告 4.1：320 并发零 5xx）。
    # 1000r/s 低于实测拐点（128 并发 ~1500-2000rps 开始劣化），留出一半余量给写入/邻居/GC；
    # 真实演示流量远低于此值，只有压测级过载会被拒。降 accept-count 治不了这个病：
    # 请求排在已建立连接上，TCP backlog 不参与（已用内嵌 Tomcat 实测 + 发压器源码核实）。
    limit_req_zone $server_name zone=vn_api_req:1m rate=1000r/s;

    server {
        listen 80;
        server_name vnest.xyz www.vnest.xyz;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 510m;
        keepalive_timeout 65s;
        keepalive_requests 1000;
        etag on;

        location ^~ /api/ {
            limit_req zone=vn_api_req burst=200 nodelay;
            limit_req_status 503;
            proxy_pass http://vn_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 覆盖而非追加：公网只有 nginx 这一跳入口，客户端自带的 XFF 一律不可信，
            # 否则伪造 XFF 即可绕过按 remoteAddr 键控的认证/播放限流（压测报告 6.1）。
            # 将来若在前面加 CDN，须同步配置 backend 的 remoteip.internal-proxies 只信任真实代理。
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
            try_files $uri =404;
            directio 4m;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            access_log off;
        }

        location ~* \.(?:css|js|mjs|map|json|txt|xml)$ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
            access_log off;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
