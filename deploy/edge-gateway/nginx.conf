# 统一入口网关：按域名分流到各项目前端容器（宿主机 docker-proxy 端口）
# 新增项目时：先把目标前端端口记下来，在下面加一个 server 块即可。

# WebSocket 升级映射（预留，AI 答疑/实时连接类项目用到）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# VideoNest：vn-frontend，宿主机 8082
server {
    listen 80;
    server_name vnest.xyz www.vnest.xyz;

    client_max_body_size 510m;

    location / {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

# HeartPilot：hp-frontend，宿主机 8081（兜底域名，未绑域名前保留）
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
