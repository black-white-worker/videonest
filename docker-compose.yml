services:
  mysql:
    image: mysql:8.4
    container_name: videonest-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/SQL.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/2026-07-29-enterprise-reliability.sql:/docker-entrypoint-initdb.d/03-enterprise-reliability.sql:ro
      - ./sql/2026-08-02-hot-upload-query-hardening.sql:/docker-entrypoint-initdb.d/04-hot-upload-query-hardening.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: videonest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    build:
      context: ./deploy/rabbitmq
    container_name: videonest-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: videonest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}";
        do sleep 2; done &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc cors set "local/$${MINIO_BUCKET}" /config/cors.xml &&
        mc ilm rule add --prefix "staging/" --expire-days 1 "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./deploy/minio/cors.xml:/config/cors.xml:ro

  backend:
    build:
      context: ./backend
    container_name: videonest-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      VIDEO_PROCESS_CONSUMER_CONCURRENCY: ${VIDEO_PROCESS_CONSUMER_CONCURRENCY:-2}
      VIDEO_VIEW_DEDUP_WINDOW_SECONDS: ${VIDEO_VIEW_DEDUP_WINDOW_SECONDS:-1800}
      ANONYMOUS_VIEW_LIMIT_PER_MINUTE: ${ANONYMOUS_VIEW_LIMIT_PER_MINUTE:-30}
      ANTIVIRUS_COMMAND: ${ANTIVIRUS_COMMAND:-}
      ANTIVIRUS_REQUIRED: ${ANTIVIRUS_REQUIRED:-false}
      UPLOAD_SCAN_TIMEOUT_SECONDS: ${UPLOAD_SCAN_TIMEOUT_SECONDS:-120}
      VIDEO_REVIEW_TIMEOUT_MILLISECONDS: ${VIDEO_REVIEW_TIMEOUT_MILLISECONDS}
      RESOURCE_RETENTION_DAYS: ${RESOURCE_RETENTION_DAYS}
      LOG_PATH: /app/logs
    volumes:
      - backend_logs:/app/logs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/videos/hot?limit=1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: videonest-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  backend_logs:
